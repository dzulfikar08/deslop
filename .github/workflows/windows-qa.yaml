# Temporary QA harness for the win32-x64 support PR (#209). Lives on the fork,
# not the PR branch: workflow_dispatch only fires for workflows that also exist
# on the default branch, and running it here keeps the PR diff clean.
name: Windows QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Build and exercise deslop.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.16.0.0"

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          # haskell-actions/setup rewrites store-dir to C:\sr on Windows
          path: C:\sr
          key: cabal-win32-x64-qa-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: cabal-win32-x64-qa-

      - run: cabal update
        shell: bash

      - name: Build
        shell: bash
        run: cabal build exe:deslop --ghc-options="-O2 -threaded -rtsopts -with-rtsopts=-N"

      - name: Collect, strip, version
        shell: bash
        run: |
          mkdir -p dist/win32-x64
          cp "$(cabal list-bin exe:deslop)" dist/win32-x64/deslop.exe
          strip --strip-unneeded dist/win32-x64/deslop.exe
          ./dist/win32-x64/deslop.exe --version

      # Informational, not a gate: evidence for the "is the exe self-contained"
      # question. Expect only system DLLs (KERNEL32, ntdll, msvcrt...); any
      # libgcc / libwinpthread / gcc_s entry means the binary is not portable.
      - name: DLL audit
        shell: bash
        run: objdump -p dist/win32-x64/deslop.exe | grep "DLL Name" || echo "objdump unavailable"

      # Problem counts pinned to the .golden/check-* expectations the linux
      # test-suite enforces, so this is a cross-OS equivalence check.
      # No cmd | grep -q pipelines here: under `bash -e -o pipefail` grep -q can
      # exit before the writer drains, SIGPIPE-ing it (msys2 pipes are narrow),
      # which fails the step even when the pattern matches. Assert on files.
      - name: Functional - fixtures and exit codes
        shell: bash
        run: |
          set +e
          ./dist/win32-x64/deslop.exe check test/fixtures/ts-cycles-project > cycles.out 2>&1
          CYCLES=$?
          ./dist/win32-x64/deslop.exe check test/fixtures/ts-project-1 > project.out 2>&1
          PROJ=$?
          set -e
          cat cycles.out
          cat project.out
          echo "cycles exit: $CYCLES (want 1), project-1 exit: $PROJ (want 1)"
          grep -q "Found 1 problem" cycles.out
          grep -q "Found 32 problems" project.out
          [ "$CYCLES" -eq 1 ] && [ "$PROJ" -eq 1 ]

      # deslop exits 1 on this fixture, so each invocation needs `|| true` to
      # survive `set -e -o pipefail`; the comparison below is the actual gate.
      - name: Functional - CRLF sources parse identically
        shell: bash
        run: |
          cp -r test/fixtures/ts-cycles-project test/fixtures/crlf-check
          find test/fixtures/crlf-check -type f \( -name '*.ts' -o -name '*.json' \) -exec sed -i 's/$/\r/' {} +
          ./dist/win32-x64/deslop.exe check test/fixtures/ts-cycles-project > lf.raw 2>&1 || true
          ./dist/win32-x64/deslop.exe check test/fixtures/crlf-check      > crlf.raw 2>&1 || true
          sed 's|ts-cycles-project|FIXTURE|g' lf.raw > lf.out
          sed 's|crlf-check|FIXTURE|g' crlf.raw > crlf.out
          diff lf.out crlf.out && echo "CRLF output identical"

      - uses: actions/upload-artifact@v7
        with:
          name: deslop-win32-x64-qa
          path: dist/win32-x64
